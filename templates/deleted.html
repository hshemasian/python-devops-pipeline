<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>מחיקת רשומה</title>
    <link rel="shortcut icon" href="images/elbit.png" type="image/x-icon">

    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: right;
            margin: 0;
            padding: 0;
            background-image: url('images/img.webp');
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.8);
        }
        .form-container input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container input[type="submit"] {
            width: calc(100% - 20px);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
        }
        .form-container input[type="submit"]:hover {
            background-color: #0056b3;
        }
        img {
  display: block; 
  margin-left: auto;
  margin-right: auto;
  width: 50%;
}

    </style>
</head>
<body>
    <div class="form-container">
        <img src="images/Employee2.jpg" width="150">
        <form action="deleted.asp" method="post" onsubmit="return validateForm()">
            <label for="mNo">הכנס מספר עובד</label>
            <input type="text" id="mNo" name="mNo" required>
            <input type="submit" value="מחק עובד">
        </form>
    </div>

    <script>
        function validateForm() {
            var mNoInput = document.getElementById("mNo");
            var mNo = mNoInput.value.trim();
            if (isNaN(mNo) || mNo === "") {
                alert("יש להזין מספר עובד תקין");
                mNoInput.focus();
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
